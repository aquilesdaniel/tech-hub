name: Testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rapidos:
    name: Tipos, unidade e integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Jest (unidade e integração)
        if: ${{ !cancelled() }}
        run: npx jest --ci

  sistema:
    name: Testes de sistema (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Descobrir a versão do Playwright
        id: playwright
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restaurar navegadores do cache
        id: cache-navegadores
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}

      - name: Instalar o Chromium
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar apenas as dependências de sistema do navegador
        if: steps.cache-navegadores.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Restaurar o cache do build do Next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'contexts/**', 'lib/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build de produção
        run: npm run build

      - name: Playwright
        run: npm run test:e2e

      - name: Guardar o relatório quando algo falha
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
